<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLIME-X Employee</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f3ef;color:#292929;font-family:Arial,sans-serif}.app{max-width:560px;min-height:100vh;margin:auto;background:#f6f3ef}.top{height:64px;background:#fff;border-bottom:1px solid #e5ded6;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:5}.logo{font-size:22px;font-weight:800;letter-spacing:1px;color:#6f5842}.lang{padding:8px;border:1px solid #ddd4cb;border-radius:9px;background:#fff}.page{padding:18px 16px 90px}.card{background:#fff;border:1px solid #e5ded6;border-radius:15px;padding:16px;margin-bottom:14px}.hero{padding:20px}.muted{color:#777;font-size:13px}h1{font-size:24px;margin:5px 0}h2{font-size:18px;margin:0}h3{font-size:15px}.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:700}.primary{background:#6f5842;color:#fff}.outline{background:#fff;color:#6f5842;border:1px solid #6f5842}.full{width:100%}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff;border:1px solid #e5ded6;border-radius:12px;padding:12px}.stat b{display:block;font-size:20px;margin-top:5px}.between{display:flex;justify-content:space-between;gap:10px;align-items:center}.claim{padding:13px 0;border-top:1px solid #eee}.badge{display:inline-block;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:bold}.pending{background:#fff1cb;color:#806000}.paid{background:#e1eefb;color:#3a638c}.approved{background:#e2f3e6;color:#377049}.rejected{background:#f7e1e1;color:#a13d3d}.neutral{background:#eee;color:#666}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);height:68px;background:#fff;border-top:1px solid #e5ded6;display:grid;grid-template-columns:repeat(4,1fr);z-index:10}.nav{border:0;background:#fff;color:#777;font-size:11px}.nav.active{color:#6f5842;font-weight:bold}.nav span{display:block;font-size:20px;margin-bottom:3px}.form{margin-bottom:12px}.form label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}.form input,.form textarea,.form select{width:100%;padding:11px;border:1px solid #ddd4cb;border-radius:10px;background:#fff}.form textarea{min-height:80px}.receipt{border:1px solid #e5ded6;border-radius:13px;padding:13px;margin-bottom:10px}.photo{height:90px;background:#f0ece7;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#888;margin-bottom:10px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.actions{display:grid;grid-template-columns:1fr 1.3fr 1.3fr;gap:6px}.actions button{padding:11px 4px;border-radius:10px;border:1px solid #ddd4cb;font-size:11px;font-weight:bold}.cancel{background:#fff}.add{background:#fff;color:#6f5842;border-color:#6f5842!important}.submit{background:#6f5842;color:#fff;border-color:#6f5842!important}.announcement{border-left:4px solid #6f5842}.responses{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px}.responses button{padding:10px 3px;border:1px solid #ddd4cb;background:#fff;border-radius:9px;font-size:10px;font-weight:bold}.responses .sel{background:#6f5842;color:#fff}.login{min-height:100vh;display:flex;align-items:center;padding:20px}.loginbox{width:100%;max-width:430px;margin:auto}.loginlogo{text-align:center;font-size:34px;font-weight:900;letter-spacing:2px;color:#6f5842;margin-bottom:5px}.modal{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end}.modalbox{background:#fff;width:min(560px,100%);max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.hidden{display:none!important}.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 14px;border-radius:9px;z-index:30;font-size:12px}
</style>
</head>
<body>

<div id="login" class="login">
<div class="loginbox">
<div style="display:flex;justify-content:flex-end">
<select id="langLogin" class="lang" onchange="setLang(this.value)">
<option value="id">🇮🇩 Indonesia</option><option value="en">🇬🇧 English</option><option value="zh">🇨🇳 中文</option>
</select></div>
<div class="loginlogo">CLIME-X</div>
<div style="text-align:center" class="muted" data-t="employeePortal">Portal Karyawan</div>
<div class="card" style="margin-top:25px">
<div class="form"><label data-t="companyId">ID Perusahaan</label><input id="company"></div>
<div class="form"><label data-t="username">Username</label><input id="user"></div>
<div class="form"><label data-t="password">Password</label><input type="password" id="pass"></div>
<p class="muted" data-t="contact">Belum memiliki akun? Hubungi administrator perusahaan.</p>
<button class="btn primary full" onclick="loginEmployee()" data-t="login">MASUK</button>
</div></div></div>

<div id="app" class="app hidden">
<header class="top"><div class="logo">CLIME-X</div>
<select id="langApp" class="lang" onchange="setLang(this.value)">
<option value="id">🇮🇩 ID</option><option value="en">🇬🇧 EN</option><option value="zh">🇨🇳 中文</option>
</select></header>
<main id="content" class="page"></main>
<nav class="bottom">
<button class="nav active" data-p="home" onclick="page('home')"><span>⌂</span><span data-t="home">Beranda</span></button>
<button class="nav" data-p="claims" onclick="page('claims')"><span>▣</span><span data-t="claims">Klaim</span></button>
<button class="nav" data-p="announce" onclick="page('announce')"><span>◉</span><span data-t="announcements">Pengumuman</span></button>
<button class="nav" data-p="profile" onclick="page('profile')"><span>●</span><span data-t="profile">Profil</span></button>
</nav></div>

<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div id="modalbox" class="modalbox"></div></div>

<script>
const D={
employeePortal:{id:"Portal Karyawan",en:"Employee Portal",zh:"员工门户"},companyId:{id:"ID Perusahaan",en:"Company ID",zh:"公司 ID"},username:{id:"Username",en:"Username",zh:"用户名"},password:{id:"Password",en:"Password",zh:"密码"},contact:{id:"Belum memiliki akun? Hubungi administrator perusahaan.",en:"Don't have an account? Contact your company administrator.",zh:"还没有账号？请联系公司管理员。"},login:{id:"MASUK",en:"LOGIN",zh:"登录"},
home:{id:"Beranda",en:"Home",zh:"首页"},claims:{id:"Klaim",en:"Claims",zh:"报销"},announcements:{id:"Pengumuman",en:"Announcements",zh:"公告"},profile:{id:"Profil",en:"Profile",zh:"个人资料"},welcome:{id:"Selamat datang",en:"Welcome",zh:"欢迎"},newClaim:{id:"Klaim Baru",en:"New Claim",zh:"新报销"},pending:{id:"Menunggu",en:"Pending",zh:"待审核"},approved:{id:"Disetujui",en:"Approved",zh:"已批准"},paid:{id:"Dibayar",en:"Paid",zh:"已支付"},recent:{id:"Klaim Terbaru",en:"Recent Claims",zh:"最近报销"},viewAll:{id:"Lihat Semua",en:"View All",zh:"查看全部"},receipt:{id:"Receipt",en:"Receipt",zh:"收据"},add:{id:"TAMBAH RECEIPT",en:"ADD RECEIPT",zh:"添加收据"},cancel:{id:"BATAL",en:"CANCEL",zh:"取消"},submit:{id:"AJUKAN KLAIM",en:"SUBMIT CLAIM",zh:"提交报销"},date:{id:"Tanggal",en:"Date",zh:"日期"},category:{id:"Kategori",en:"Category",zh:"类别"},amount:{id:"Nominal",en:"Amount",zh:"金额"},currency:{id:"Mata Uang",en:"Currency",zh:"货币"},description:{id:"Keterangan",en:"Description",zh:"说明"},total:{id:"TOTAL KLAIM",en:"TOTAL CLAIM",zh:"报销总额"},remove:{id:"Hapus",en:"Remove",zh:"删除"},noClaims:{id:"Belum ada klaim.",en:"No claims yet.",zh:"暂无报销记录。"},status:{id:"Status",en:"Status",zh:"状态"},submitted:{id:"Diajukan",en:"Submitted",zh:"已提交"},review:{id:"Sedang Diperiksa",en:"Under Review",zh:"审核中"},annTitle:{id:"Pengumuman Perusahaan",en:"Company Announcements",zh:"公司公告"},understood:{id:"FAHAM",en:"UNDERSTOOD",zh:"已了解"},ask:{id:"TANYA ADMIN",en:"ASK ADMIN",zh:"咨询管理员"},neutral:{id:"NETRAL",en:"NEUTRAL",zh:"中立"},read:{id:"Dibaca",en:"Read",zh:"已读"},question:{id:"Tulis pertanyaan untuk admin...",en:"Write a question for admin...",zh:"请输入给管理员的问题..."},send:{id:"KIRIM",en:"SEND",zh:"发送"},events:{id:"Event",en:"Events",zh:"活动"},profileTitle:{id:"Profil Saya",en:"My Profile",zh:"我的资料"},department:{id:"Departemen",en:"Department",zh:"部门"},email:{id:"Email",en:"Email",zh:"电子邮件"},change:{id:"Ubah Password",en:"Change Password",zh:"修改密码"},logout:{id:"Keluar",en:"Logout",zh:"退出"}
};
let L=localStorage.getItem("climex_lang")||"id",current="home",receipts=[];
let claims=[{id:"CLX-00018",count:3,total:173.5,currency:"USD",status:"paid",date:"24 Sep 2026"},{id:"CLX-00021",count:2,total:86,currency:"USD",status:"pending",date:"24 Sep 2026"}];
let anns=[{id:1,title:{id:"Kebijakan Perjalanan Dinas Baru",en:"New Business Travel Policy",zh:"新的商务旅行政策"},text:{id:"Mulai 1 Oktober, seluruh karyawan yang melakukan perjalanan dinas wajib menggunakan prosedur perjalanan terbaru.",en:"Starting October 1, all employees travelling for business must follow the new travel procedure.",zh:"从10月1日起，所有出差员工必须遵守新的出差流程。"},response:null,question:"",read:""},{id:2,title:{id:"Informasi Perusahaan",en:"Company Information",zh:"公司信息"},text:{id:"Mohon perhatikan informasi terbaru dari manajemen.",en:"Please take note of the latest information from management.",zh:"请注意管理层发布的最新信息。"},response:"understood",question:"",read:"24 Sep 2026, 14:32"}];
let events=[{title:{id:"Annual Company Dinner 2026",en:"Annual Company Dinner 2026",zh:"2026年度公司晚宴"},date:"20 Dec 2026",time:"19:00",location:"Grand Ballroom",text:{id:"Acara tahunan perusahaan untuk seluruh karyawan.",en:"Annual company event for all employees.",zh:"面向全体员工的年度公司活动。"}}];
function t(k){return D[k]?.[L]||k}
function setLang(v){L=v;localStorage.setItem("climex_lang",v);langLogin.value=v;langApp.value=v;apply();if(!app.classList.contains("hidden"))page(current)}
function apply(){document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t))}
function loginEmployee(){document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");page("home")}
function page(p){current=p;document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x.dataset.p===p));if(p==="home")home();if(p==="claims")claimsPage();if(p==="announce")announcePage();if(p==="profile")profilePage();apply()}
function badge(s){let m={pending:["pending",t("pending")],paid:["paid",t("paid")],approved:["approved",t("approved")],rejected:["rejected","REJECTED"]};return `<span class="badge ${m[s][0]}">${m[s][1]}</span>`}
function rows(){return claims.map(x=>`<div class="claim"><div class="between"><div><b>${x.id}</b><div class="muted">${x.count} ${t("receipt")} · ${x.date}</div></div><div style="text-align:right"><b>${x.currency} ${x.total.toFixed(2)}</b><br>${badge(x.status)}</div></div></div>`).join("")}
function home(){content.innerHTML=`<div class="card hero"><div class="muted">${t("welcome")}</div><h1>John Smith</h1><div class="muted">EMP-00125 · Operations</div><button class="btn primary full" style="margin-top:16px" onclick="newClaim()">+ ${t("newClaim")}</button></div><div class="stats"><div class="stat"><span class="muted">${t("pending")}</span><b>1</b></div><div class="stat"><span class="muted">${t("approved")}</span><b>0</b></div><div class="stat"><span class="muted">${t("paid")}</span><b>1</b></div></div><div class="card" style="margin-top:14px"><div class="between"><h2>${t("recent")}</h2><button class="btn outline" onclick="page('claims')">${t("viewAll")}</button></div>${rows()}</div><div class="card announcement"><div class="muted">${t("announcements")}</div><h3>${anns[0].title[L]}</h3><div class="muted">${anns[0].text[L]}</div></div>`}
function claimsPage(){content.innerHTML=`<div class="between"><h1>${t("claims")}</h1><button class="btn primary" onclick="newClaim()">+ ${t("newClaim")}</button></div><div class="card" style="margin-top:14px">${rows()||`<div class="muted">${t("noClaims")}</div>`}</div>`}
function newClaim(){receipts=[];addReceipt();modal.classList.remove("hidden");renderReceipts()}
function addReceipt(){receipts.push({id:Date.now()+Math.random(),date:"",category:"",amount:"",currency:"USD",desc:"",photo:""})}
function renderReceipts(){modalbox.innerHTML=`<div class="between"><h2>${t("newClaim")}</h2><button class="btn outline" onclick="closeModal()">×</button></div><div id="rlist"></div><div class="between" style="margin:12px 0"><b>${t("total")}</b><b id="sum">USD 0.00</b></div><div class="actions"><button class="cancel" onclick="closeModal()">${t("cancel")}</button><button class="add" onclick="addReceipt();renderReceipts()">${t("add")}</button><button class="submit" onclick="submitClaim()">${t("submit")}</button></div>`;rlist.innerHTML=receipts.map((r,i)=>`<div class="receipt"><div class="between"><h3>${t("receipt")} #${i+1}</h3>${receipts.length>1?`<button class="btn outline" onclick="removeR(${r.id})">${t("remove")}</button>`:""}</div><div class="photo">${r.photo?`<img src="${r.photo}">`:"Receipt Photo"}</div><div class="form"><input type="file" accept="image/*" capture="environment" onchange="photo(${r.id},this)"></div><div class="form"><label>${t("date")}</label><input type="date" value="${r.date}" onchange="up(${r.id},'date',this.value)"></div><div class="form"><label>${t("category")}</label><input value="${r.category}" onchange="up(${r.id},'category',this.value)"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="form"><label>${t("currency")}</label><select onchange="up(${r.id},'currency',this.value)">${["USD","EUR","SGD","IDR","CNY","JPY"].map(x=>`<option ${r.currency===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="form"><label>${t("amount")}</label><input type="number" step="0.01" value="${r.amount}" onchange="up(${r.id},'amount',this.value)"></div></div><div class="form"><label>${t("description")}</label><textarea onchange="up(${r.id},'desc',this.value)">${r.desc}</textarea></div></div>`).join("");updateSum()}
function up(id,k,v){let r=receipts.find(x=>x.id===id);if(r)r[k]=v;updateSum()}
function removeR(id){receipts=receipts.filter(x=>x.id!==id);renderReceipts()}
function photo(id,input){let f=input.files[0];if(!f)return;let q=new FileReader();q.onload=e=>{let r=receipts.find(x=>x.id===id);r.photo=e.target.result;renderReceipts()};q.readAsDataURL(f)}
function updateSum(){let c=receipts[0]?.currency||"USD";let n=receipts.reduce((a,x)=>a+(parseFloat(x.amount)||0),0);let s=document.getElementById("sum");if(s)s.textContent=`${c} ${n.toFixed(2)}`}
function submitClaim(){let n=receipts.reduce((a,x)=>a+(parseFloat(x.amount)||0),0),c=receipts[0]?.currency||"USD";claims.unshift({id:"CLX-"+Math.floor(10000+Math.random()*89999),count:receipts.length,total:n,currency:c,status:"pending",date:"24 Sep 2026"});closeModal();toast("✓ "+t("submit"));claimsPage()}
function announcePage(){content.innerHTML=`<div><div class="muted">${t("announcements")}</div><h1>${t("annTitle")}</h1></div>${anns.map(a=>`<div class="card announcement"><div class="muted">24 Sep 2026</div><h2 style="margin:7px 0">${a.title[L]}</h2><p style="line-height:1.5">${a.text[L]}</p><div class="responses"><button class="${a.response==="understood"?"sel":""}" onclick="respond(${a.id},'understood')">${t("understood")}</button><button class="${a.response==="ask"?"sel":""}" onclick="ask(${a.id})">${t("ask")}</button><button class="${a.response==="neutral"?"sel":""}" onclick="respond(${a.id},'neutral')">${t("neutral")}</button></div>${a.question?`<div class="muted" style="margin-top:9px">${a.question}</div>`:""}${a.read?`<div class="muted" style="margin-top:7px">${t("read")}: ${a.read}</div>`:""}</div>`).join("")}<div class="card"><h2>${t("events")}</h2><h3>${events[0].title[L]}</h3><div class="muted">${events[0].date} · ${events[0].time} · ${events[0].location}</div><p class="muted">${events[0].text[L]}</p></div>`}
function respond(id,r){let a=anns.find(x=>x.id===id);a.response=r;a.read=new Date().toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});toast("✓");announcePage()}
function ask(id){let q=prompt(t("question"));if(q===null)return;let a=anns.find(x=>x.id===id);a.response="ask";a.question=q;a.read=new Date().toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});toast("✓");announcePage()}
function profilePage(){content.innerHTML=`<h1>${t("profileTitle")}</h1><div class="card"><h2>John Smith</h2><div class="muted">EMP-00125</div><hr style="border:0;border-top:1px solid #eee;margin:15px 0"><div class="muted">${t("department")}</div><b>Operations</b><div class="muted" style="margin-top:12px">${t("email")}</div><b>john@company.com</b><div class="muted" style="margin-top:12px">${t("companyId")}</div><b>ABC001</b></div><div class="card"><button class="btn outline full">${t("change")}</button><button class="btn outline full" style="margin-top:9px" onclick="location.reload()">${t("logout")}</button></div>`}
function closeModal(){modal.classList.add("hidden")}
function toast(s){let x=document.createElement("div");x.className="toast";x.textContent=s;document.body.appendChild(x);setTimeout(()=>x.remove(),1600)}
setLang(L);apply();
</script>
</body>
</html>
