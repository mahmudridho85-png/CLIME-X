<script>
const firebaseConfig = {
    apiKey:"AIzaSyCXzfGE9hri8f1uh6aRozW7uaft4ZlHohI",
    authDomain:"kasir-cuan-pos.firebaseapp.com",
    projectId:"kasir-cuan-pos",
    storageBucket:"kasir-cuan-pos.firebasestorage.app",
    messagingSenderId:"525682379931",
    appId:"1:525682379931:web:77b36c3dd62e9cd7134a3e"
};

firebase.initializeApp(firebaseConfig);

// ==============================
// AUTH KHUSUS MOBILE CONSOLE
// Dipisahkan dari Employee App
// ==============================
const climexConsoleApp =
    firebase.initializeApp(
        firebaseConfig,
        "climexMobileConsole"
    );

const climexAuth =
    climexConsoleApp.auth();

const climexDB =
    climexConsoleApp.firestore();

climexAuth.setPersistence(
    firebase.auth.Auth.Persistence.LOCAL
).catch(function(error){
    console.error("CLIME-X CONSOLE AUTH PERSISTENCE ERROR:", error);
});

async function verifyConsoleAdministrator(user){

    if(!user){
        return false;
    }

    try{

        const profileSnap =
            await climexDB
                .collection("users")
                .doc(user.uid)
                .collection("climex")
                .doc("profile")
                .get();

        if(!profileSnap.exists){
            return false;
        }

        const profile = profileSnap.data();

        // Simpan data perusahaan dari Firebase
        window.climexCompanyProfile = profile;

        return String(profile.role || "").trim() === "Administrator";

    }catch(error){

        console.error(
            "CLIME-X CONSOLE ROLE CHECK ERROR:",
            error
        );

        return false;
    }
}

let authStateVersion = 0;

climexAuth.onAuthStateChanged(async function(user){

    const currentVersion = ++authStateVersion;

    const startup = document.getElementById("startup");
    const loginPage = document.getElementById("login");
    const appPage = document.getElementById("app");

    if(startup){
        startup.style.display = "none";
    }

    console.log(
        "CLIME-X AUTH CHECK:",
        user ? user.uid : "BELUM LOGIN"
    );

    // BELUM LOGIN
    if(!user){

        if(loginPage){
            loginPage.style.visibility = "visible";
            loginPage.classList.remove("hidden");
        }

        if(appPage){
            appPage.classList.add("hidden");
        }

        // KOSONGKAN EMAIL & PASSWORD LOGIN
        if(loginPage){
            const inputs = loginPage.querySelectorAll("input");

            if(inputs[0]){
                inputs[0].value = "";
            }

            if(inputs[1]){
                inputs[1].value = "";
            }
        }

        return;
    }

    // CEK ADMINISTRATOR
    const isAdministrator =
        await verifyConsoleAdministrator(user);

    // Jika selama proses pengecekan user sudah logout,
    // abaikan hasil pengecekan lama.
    if(currentVersion !== authStateVersion){
        return;
    }

    if(!isAdministrator){

        console.log(
            "CLIME-X: akun bukan Administrator, akses ditolak."
        );

        await climexAuth.signOut();

        return;
    }

    // CEK LAGI setelah proses async
    if(currentVersion !== authStateVersion){
        return;
    }

    if(loginPage){
        loginPage.classList.add("hidden");
    }

    if(appPage){
        appPage.classList.remove("hidden");
    }

    if(typeof page === "function"){
        page("home");
    }

    console.log(
        "CLIME-X AUTO LOGIN ADMIN OK:",
        user.uid
    );

});


// LOGOUT CLIME-X CONSOLE
async function logoutClimeX(){

    // Naikkan versi supaya proses login/cek lama
    // tidak boleh mengembalikan Dashboard.
    authStateVersion++;

    const loginPage = document.getElementById("login");
    const appPage = document.getElementById("app");

    // LANGSUNG tampilkan LOGIN
    if(appPage){
        appPage.classList.add("hidden");
    }

    if(loginPage){
        loginPage.style.visibility = "visible";
        loginPage.classList.remove("hidden");
    }

    // KOSONGKAN EMAIL & PASSWORD
    if(loginPage){
        const inputs = loginPage.querySelectorAll("input");

        if(inputs[0]){
            inputs[0].value = "";
        }

        if(inputs[1]){
            inputs[1].value = "";
        }
    }

    // Logout Firebase
    try{
        await climexAuth.signOut();
        console.log("CLIME-X LOGOUT OK");
    }catch(error){
        console.error("CLIME-X LOGOUT ERROR:", error);
    }
}

</script>

</head>

async function loadClimexClaims(){

    try{

        if(!climexAuth.currentUser){
            console.log("CLIME-X CLAIMS: user belum login");
            return;
        }

        const uid = climexAuth.currentUser.uid;

        const snapshot = await climexDB
            .collection("users")
            .doc(uid)
            .collection("climex")
            .doc("claims")
            .collection("items")
            .orderBy("createdAt", "desc")
            .limit(20)
            .get();

        claims = [];

        snapshot.forEach(function(doc){

            const data = doc.data();

            let date = "-";

            if(data.createdAt && data.createdAt.toDate){
                date = data.createdAt.toDate()
                    .toLocaleDateString("id-ID", {
                        day:"2-digit",
                        month:"short",
                        year:"numeric"
                    });
            }

            claims.push({
                id: data.id || doc.id,
                name: data.employeeName || data.employee || "-",
                dept: data.department || "-",
                count: Number(data.count) || 0,
                total: Number(data.total) || 0,
                currency: data.currency || "IDR",
                status: String(data.status || "pending").toLowerCase(),
                date: date,
                category: data.category || "-"
            });

        });

        console.log(
            "CLIME-X CLAIMS LOAD OK:",
            claims.length
        );

    }catch(error){

        console.error(
            "CLIME-X CLAIMS LOAD ERROR:",
            error
        );

    }
}

async function loadMonthlyClaimActivity(){

    if(!climexAuth.currentUser){
        return {
            days: [],
            counts: [],
            total: 0
        };
    }

    try{

        const now = new Date();

        const year = now.getFullYear();
        const month = now.getMonth();

        const startDate = new Date(year, month, 1, 0, 0, 0, 0);
        const endDate = new Date(year, month + 1, 1, 0, 0, 0, 0);

        const dayCount =
            new Date(year, month + 1, 0).getDate();

        const counts =
            Array(dayCount).fill(0);

        const snapshot =
            await climexDB
                .collection("users")
                .doc(climexAuth.currentUser.uid)
                .collection("climex")
                .doc("claims")
                .collection("items")
                .where(
                    "createdAt",
                    ">=",
                    firebase.firestore.Timestamp.fromDate(startDate)
                )
                .where(
                    "createdAt",
                    "<",
                    firebase.firestore.Timestamp.fromDate(endDate)
                )
                .get();

        snapshot.forEach(function(doc){

            const data = doc.data();

            if(
                data.createdAt &&
                typeof data.createdAt.toDate === "function"
            ){

                const d = data.createdAt.toDate();

                if(
                    d.getFullYear() === year &&
                    d.getMonth() === month
                ){

                    counts[d.getDate() - 1]++;

                }

            }

        });

        return {
            days: dayCount,
            counts: counts,
            total: counts.reduce(
                (sum, value) => sum + value,
                0
            )
        };

    }catch(error){

        console.error(
            "CLIME-X MONTHLY CLAIM ACTIVITY ERROR:",
            error
        );

        return {
            days: 0,
            counts: [],
            total: 0,
            error: true
        };
    }
}


function renderClaimActivityChart(activity){

    const width = 360;
    const height = 205;

    const left = 28;
    const right = 10;
    const top = 14;
    const bottom = 32;

    const chartWidth = width - left - right;
    const chartHeight = 132;

    const counts = activity.counts || [];
    const days = activity.days || counts.length;

    const maxValue =
        Math.max(
            1,
            ...(counts.length ? counts : [0])
        );

    const points = counts.map(function(value,index){

        const x =
            left +
            (
                days <= 1
                    ? 0
                    : (index / (days - 1)) * chartWidth
            );

        const y =
            top +
            chartHeight -
            (value / maxValue) * chartHeight;

        return {
            x:x,
            y:y,
            value:value
        };

    });

    const linePath =
        points.length
            ? points.map(function(p,index){
                return (
                    index === 0 ? "M " : "L "
                ) +
                p.x.toFixed(2) +
                " " +
                p.y.toFixed(2);
            }).join(" ")
            : "";

    const baseY = top + chartHeight;

    const areaPath =
        points.length
            ? linePath +
              " L " +
              points[points.length - 1].x.toFixed(2) +
              " " +
              baseY +
              " L " +
              points[0].x.toFixed(2) +
              " " +
              baseY +
              " Z"
            : "";

    const gridValues = [
        maxValue,
        Math.ceil(maxValue / 2),
        0
    ];

    const grid = gridValues.map(function(value){

        const y =
            top +
            chartHeight -
            (value / maxValue) * chartHeight;

        return `
            <line
                x1="${left}"
                y1="${y}"
                x2="${width - right}"
                y2="${y}"
                stroke="#e8e3dd"
                stroke-width="1"
            />
            <text
                x="${left - 7}"
                y="${y + 4}"
                text-anchor="end"
                font-size="9"
                fill="#9a9188"
            >${value}</text>
        `;

    }).join("");

    const labelIndexes = [];

    if(days > 0){
        [0,4,9,14,19,24,29,days - 1]
            .forEach(function(index){

                if(
                    index >= 0 &&
                    index < days &&
                    !labelIndexes.includes(index)
                ){
                    labelIndexes.push(index);
                }

            });
    }

    const labels = labelIndexes.map(function(index){

        const x =
            left +
            (
                days <= 1
                    ? 0
                    : (index / (days - 1)) * chartWidth
            );

        return `
            <text
                x="${x}"
                y="${height - 8}"
                text-anchor="middle"
                font-size="9"
                fill="#8e857d"
            >${index + 1}</text>
        `;

    }).join("");

    const monthLabel =
        new Date(
            new Date().getFullYear(),
            new Date().getMonth(),
            1
        ).toLocaleDateString(
            L === "zh"
                ? "zh-CN"
                : L === "en"
                    ? "en-US"
                    : "id-ID",
            {
                month:"long",
                year:"numeric"
            }
        );

    const emptyText =
        activity.total === 0
            ? `
                <text
                    x="${width / 2}"
                    y="83"
                    text-anchor="middle"
                    font-size="11"
                    fill="#9a9188"
                >
                    ${t("noClaimsCreated")}
                </text>
            `
            : "";

    return `
        <div class="card claim-activity-card">

            <div class="between" style="margin-bottom:2px">

                <div>
                    <h2>${t("claimActivity")}</h2>
                    <div class="muted">
                        ${t("claimActivityMonth")} · ${monthLabel}
                    </div>
                </div>

                <span
                    style="
                        display:inline-flex;
                        align-items:center;
                        justify-content:center;
                        min-width:34px;
                        height:28px;
                        padding:0 9px;
                        border-radius:99px;
                        background:#e6f3ed;
                        color:#19764f;
                        font-size:11px;
                        font-weight:800;
                    "
                >
                    ${activity.total}
                </span>

            </div>

            <div
                style="
                    width:100%;
                    margin-top:8px;
                    overflow:hidden;
                    border-radius:12px;
                    background:#fff;
                "
            >

                <svg
                    viewBox="0 0 ${width} ${height}"
                    width="100%"
                    height="205"
                    preserveAspectRatio="none"
                    style="display:block;"
                >

                    <defs>

                        <linearGradient
                            id="claimAreaGradient"
                            x1="0"
                            y1="0"
                            x2="0"
                            y2="1"
                        >
                            <stop
                                offset="0%"
                                stop-color="#22b879"
                                stop-opacity=".28"
                            />
                            <stop
                                offset="100%"
                                stop-color="#22b879"
                                stop-opacity=".03"
                            />
                        </linearGradient>

                    </defs>

                    ${grid}

                    ${areaPath
                        ? `<path
                            d="${areaPath}"
                            fill="url(#claimAreaGradient)"
                            stroke="none"
                        />`
                        : ""
                    }

                    ${linePath
                        ? `<path
                            d="${linePath}"
                            fill="none"
                            stroke="#18a66d"
                            stroke-width="3"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />`
                        : ""
                    }

                    ${emptyText}

                    ${labels}

                </svg>

            </div>

            

        </div>
    `;
}

async function loadContractExpiringCount(){

    const target =
        document.getElementById("homeContractExpiringCount");

    if(!target || !climexAuth.currentUser){
        return;
    }

    try{

        const snapshot =
            await climexDB
                .collection("users")
                .doc(climexAuth.currentUser.uid)
                .collection("climex")
                .doc("employees")
                .collection("items")
                .get();

        const today = new Date();
        today.setHours(0,0,0,0);

        let count = 0;

        snapshot.forEach(function(doc){

            const employee = doc.data() || {};
            const contractEnd = employee.contractEnd || "";

            if(!contractEnd){
                return;
            }

            const endDate = new Date(contractEnd + "T00:00:00");

            if(isNaN(endDate.getTime())){
                return;
            }

            endDate.setHours(0,0,0,0);

            const days = Math.ceil(
                (endDate.getTime() - today.getTime()) /
                (1000 * 60 * 60 * 24)
            );

            if(days <= 15){
                count++;
            }

        });

        if(current === "home" && target){
            target.textContent = count;
        }

    }catch(error){

        console.error(
            "CLIME-X CONTRACT EXPIRING COUNT ERROR:",
            error
        );

    }
}

        return;
    }

    list.innerHTML = `<div class="muted" style="padding:20px 0;text-align:center;">Memuat pengajuan cuti...</div>`;

        const snapshot = await climexDB
            .collection("users")
            .doc(climexAuth.currentUser.uid)
            .collection("climex")
            .doc("leave")
            .collection("items")
            .get();

        mobileLeaveRequests = [];

        snapshot.forEach(function(doc){
            mobileLeaveRequests.push({
                ...(doc.data() || {}),
                _docId:doc.id
            });

async function loadClaimEmployeeNameMap(){

    const result = {
        masterByKey:new Map(),
        accountByKey:new Map()
    };

    if(!climexAuth.currentUser){
        return result;
    }

    const uid = climexAuth.currentUser.uid;

    try{

        const masterSnapshot =
            await climexDB
                .collection("users")
                .doc(uid)
                .collection("climex")
                .doc("employees")
                .collection("items")
                .get();

        masterSnapshot.forEach(function(doc){

            const data = doc.data() || {};

            const employee = {
                name:String(data.name || "").trim(),
                id:String(data.id || "").trim(),
                climexEmployeeId:String(data.climexEmployeeId || "").trim(),
                climexAuthUid:String(data.climexAuthUid || "").trim()
            };

            [
                employee.id,
                employee.climexEmployeeId,
                employee.climexAuthUid,
                employee.name
            ].forEach(function(key){
                if(key){
                    result.masterByKey.set(key.toLowerCase(),employee);
                }
            });

        });

    }catch(error){
        console.error("CLIME-X MASTER EMPLOYEE NAME LOAD ERROR:",error);
    }

    try{

        const accountSnapshot =
            await climexDB
                .collection("users")
                .doc(uid)
                .collection("climex")
                .doc("employeeAccounts")
                .collection("items")
                .get();

        accountSnapshot.forEach(function(doc){

            const data = doc.data() || {};

            const employee = {
                name:String(data.name || "").trim(),
                employeeId:String(data.employeeId || doc.id || "").trim(),
                authUid:String(data.authUid || "").trim()
            };

            [
                employee.employeeId,
                employee.authUid,
                employee.name,
                doc.id
            ].forEach(function(key){
                if(key){
                    result.accountByKey.set(key.toLowerCase(),employee);
                }
            });

        });

    }catch(error){
        console.error("CLIME-X EMPLOYEE ACCOUNT NAME LOAD ERROR:",error);
    }

    return result;
}


function resolveFullClaimEmployeeName(data,nameMaps){

    const directKeys = [
        data.climexEmployeeId,
        data.employeeId,
        data.employeeUid,
        data.employee,
        data.employeeName
    ];

    for(const value of directKeys){

        const key = String(value || "").trim().toLowerCase();

        if(!key){
            continue;
        }

        const master = nameMaps.masterByKey.get(key);

        if(master && master.name){
            return master.name;
        }
    }

    /*
     * Claim lama kadang menyimpan employeeName seperti "nunung".
     * Cocokkan dulu ke akun Employee Clime-X, lalu gunakan
     * relationship climexEmployeeId pada Data Karyawan sebagai
     * sumber nama lengkap resmi.
     */
    for(const value of directKeys){

        const key = String(value || "").trim().toLowerCase();

        if(!key){
            continue;
        }

        const account = nameMaps.accountByKey.get(key);

        if(account){

            const masterKeys = [
                account.employeeId,
                account.authUid,
                account.name
            ];

            for(const masterValue of masterKeys){

                const masterKey =
                    String(masterValue || "").trim().toLowerCase();

                if(!masterKey){
                    continue;
                }

                const master =
                    nameMaps.masterByKey.get(masterKey);

                if(master && master.name){
                    return master.name;
                }
            }

            if(account.name){
                return account.name;
            }
        }
    }

    return String(
        data.employeeName ||
        data.employee ||
        "-"
    ).trim() || "-";
}


function formatLongIndonesianDate(value){

    if(!value){
        return "-";
    }

    let date = null;

    if(value && typeof value.toDate === "function"){
        date = value.toDate();
    }else if(value instanceof Date){
        date = value;
    }else{
        const parsed = new Date(value);
        if(!Number.isNaN(parsed.getTime())){
            date = parsed;
        }
    }

    if(!date){
        return String(value);
    }

    const months = [
        "Januari","Februari","Maret","April","Mei","Juni",
        "Juli","Agustus","September","Oktober","November","Desember"
    ];

    return String(date.getDate()).padStart(2,"0") +
        " " +
        months[date.getMonth()] +
        " " +
        date.getFullYear();
}

function startLeaveRealtime(){

        renderLeaveRows();

            .collection("users")
            .doc(uid)
            .collection("climex")
            .doc("leave")
            .collection("items");

    leaveRealtimeUnsubscribe =
        leaveRef.onSnapshot(
            function(snapshot){

                mobileLeaveRequests = [];

                snapshot.forEach(function(doc){
                    mobileLeaveRequests.push({
                        ...(doc.data() || {}),
                        _docId:doc.id
                    });
                });

                renderLeaveRows();
            },
            function(error){
                console.error("CLIME-X LEAVE REALTIME ERROR:",error);
                mobileLeaveRequests = [];
                renderLeaveRows();
            }
        );

function filterLeaveRequests(value){
    mobileLeaveSearchText =
        String(value || "").trim().toLowerCase();
    renderLeaveRows();
}


function leaveRequestName(item){
    return String(
        item.employeeName ||
        item.name ||
        item.employee ||
        "-"
    ).trim() || "-";
}


function leaveRequestEmployeeId(item){
    return String(
        item.employeeId ||
        item.idKaryawan ||
        item.employeeNo ||
        item.id ||
        "-"
    ).trim() || "-";
}


function leaveRequestStart(item){
    return item.startDate || item.leaveDate || item.date || item.tanggalCuti || "";
}


function leaveRequestEnd(item){
    return item.endDate || item.tanggalSelesai || "";
}


function leaveRequestDuration(item){

    const direct =
        Number(
            item.durationDays ??
            item.days ??
            item.leaveDays ??
            item.lamaCuti
        );

    if(Number.isFinite(direct) && direct > 0){
        return direct;
    }

    const startValue = leaveRequestStart(item);
    const endValue = leaveRequestEnd(item);

    if(startValue && endValue){
        const start = new Date(String(startValue).slice(0,10) + "T00:00:00");
        const end = new Date(String(endValue).slice(0,10) + "T00:00:00");

        if(!Number.isNaN(start.getTime()) && !Number.isNaN(end.getTime())){
            const diff = Math.floor((end.getTime() - start.getTime()) / 86400000) + 1;
            if(diff > 0){
                return diff;
            }
        }
    }

    return 0;
}


function formatLeaveDate(value){

    if(!value){
        return "-";
    }

    let date = null;

    if(value && typeof value.toDate === "function"){
        date = value.toDate();
    }else{
        const raw = String(value).slice(0,10);
        const parsed = new Date(raw + (raw.length === 10 ? "T00:00:00" : ""));
        if(!Number.isNaN(parsed.getTime())){
            date = parsed;
        }
    }

    if(!date){
        return "-";
    }

    return date.toLocaleDateString("id-ID",{
        day:"2-digit",
        month:"long",
        year:"numeric"
    });
}


function renderLeaveRows(){

    const body = document.getElementById("mobileLeaveBody");

    if(!body){
        return;
    }

    let requests = mobileLeaveRequests.slice();

    if(mobileLeaveSearchText){
        requests = requests.filter(function(item){
            const name = leaveRequestName(item).toLowerCase();
            const id = leaveRequestEmployeeId(item).toLowerCase();
            return name.includes(mobileLeaveSearchText) || id.includes(mobileLeaveSearchText);
        });
    }

    requests.sort(function(a,b){
        const da = new Date(String(leaveRequestStart(a)).slice(0,10) + "T00:00:00").getTime();
        const db = new Date(String(leaveRequestStart(b)).slice(0,10) + "T00:00:00").getTime();
        return (isNaN(db) ? 0 : db) - (isNaN(da) ? 0 : da);
    });

    if(!requests.length){
        body.innerHTML = `
            <tr>
                <td colspan="4" style="padding:22px 8px;text-align:center;color:#888;">
                    ${mobileLeaveSearchText ? "Nama karyawan tidak ditemukan" : "Belum ada pengajuan cuti."}
                </td>
            </tr>
        `;
        return;
    }

    body.innerHTML = requests.map(function(item,index){
        const name = leaveRequestName(item);
        const start = formatLeaveDate(leaveRequestStart(item));
        const days = leaveRequestDuration(item);
        const docId = String(item._docId || "").replace(/'/g,"\\'");

        return `

                    ${name}

                <td style="padding:12px 6px;border-bottom:1px solid #eee;white-space:nowrap;">${start}</td>
                <td style="padding:12px 6px;border-bottom:1px solid #eee;font-weight:700;white-space:nowrap;">${days || 0} Hari</td>

}


async function loadLeaveEmployeeDetail(request){

    const detail = {
        department: request.department || request.dept || request.departemen || "-",
        position: request.position || request.jobTitle || request.jabatan || "-",
        remainingLeave: request.remainingLeave ?? request.sisaCuti ?? request.leaveBalance ?? request.remainingLeaveDays ?? request.sisaCutiDays ?? null
    };

    if(
        detail.department !== "-" &&
        detail.position !== "-" &&
        detail.remainingLeave !== null &&
        detail.remainingLeave !== undefined
    ){
        return detail;
    }

    if(!climexAuth.currentUser){
        return detail;
    }

    try{

        const snapshot =
            await climexDB
                .collection("users")
                .doc(climexAuth.currentUser.uid)
                .collection("climex")
                .doc("employees")
                .collection("items")
                .get();

        const requestUid = String(
            request.employeeUid || request.authUid || ""
        ).trim().toLowerCase();

        const requestId = leaveRequestEmployeeId(request).toLowerCase();
        const requestName = leaveRequestName(request).toLowerCase();

        let matched = null;

        snapshot.forEach(function(doc){

            if(matched){
                return;
            }

            const employee = doc.data() || {};

            const employeeUid = String(
                employee.employeeUid || employee.authUid || employee.uid || ""
            ).trim().toLowerCase();

            const employeeId = String(
                employee.employeeId || employee.id || employee.climexId || ""
            ).trim().toLowerCase();

            const employeeName = String(
                employee.name || employee.employeeName || ""
            ).trim().toLowerCase();

            if(
                (requestUid && employeeUid && requestUid === employeeUid) ||
                (requestId && employeeId && requestId === employeeId) ||
                (requestName && employeeName && requestName === employeeName)
            ){
                matched = employee;
            }
        });

        if(matched){
            detail.department =
                detail.department !== "-"
                    ? detail.department
                    : String(
                        matched.department ||
                        matched.dept ||
                        matched.departemen ||
                        "-"
                    );

            detail.position =
                detail.position !== "-"
                    ? detail.position
                    : String(
                        matched.position ||
                        matched.jobTitle ||
                        matched.jabatan ||
                        "-"
                    );

            if(detail.remainingLeave === null || detail.remainingLeave === undefined){
                detail.remainingLeave =
                    matched.remainingLeave ??
                    matched.sisaCuti ??
                    matched.leaveBalance ??
                    matched.remainingLeaveDays ??
                    matched.sisaCutiDays ??
                    null;
            }
        }

    }catch(error){
        console.error("CLIME-X LEAVE EMPLOYEE DETAIL ERROR:",error);
    }

    return detail;
}

    try{

        await climexDB
            .collection("users")
            .doc(uid)
            .collection("climex")
            .doc("leave")
            .collection("items")
            .doc(docId)
            .set({
                status:newStatus,

function filterContractEmployees(value){

    mobileContractSearchText =
        String(value || "").trim().toLowerCase();

    renderContractEmployeeRows();
}


function renderContractEmployeeRows(){

    const body =
        document.getElementById("mobileEmployeeBody");

    if(!body){
        return;
    }

    const today = new Date();
    today.setHours(0,0,0,0);

    let employees = mobileContractEmployees.slice();

    if(mobileContractSearchText){
        employees = employees.filter(function(employee){
            const name = String(employee.name || "").toLowerCase();
            const id = String(
                employee.employeeId ||
                employee.id ||
                employee.climexId ||
                ""
            ).toLowerCase();

            return name.includes(mobileContractSearchText) ||
                   id.includes(mobileContractSearchText);
        });
    }

    employees.sort(function(a,b){

        function getDays(employee){

            const contractEnd = employee.contractEnd || "";

            if(!contractEnd){
                return Number.POSITIVE_INFINITY;
            }

            const endDate = new Date(contractEnd + "T00:00:00");

            if(isNaN(endDate.getTime())){
                return Number.POSITIVE_INFINITY;
            }

            endDate.setHours(0,0,0,0);

            return Math.ceil(
                (endDate.getTime() - today.getTime()) /
                (1000 * 60 * 60 * 24)
            );
        }

        const daysA = getDays(a);
        const daysB = getDays(b);

        if(daysA !== daysB){
            return daysA - daysB;
        }

        return String(a.name || "").localeCompare(
            String(b.name || ""),
            "id-ID",
            {sensitivity:"base"}
        );

    });

    if(!employees.length){

        body.innerHTML = `
            <tr>
                <td
                    colspan="4"
                    style="
                        padding:20px 8px;
                        text-align:center;
                        color:#888;
                    "
                >
                    ${mobileContractSearchText
                        ? "Nama karyawan tidak ditemukan"
                        : "Belum ada data karyawan"}
                </td>
            </tr>
        `;

        return;
    }

    body.innerHTML =
        employees.map(function(employee,index){

            const contractEnd =
                employee.contractEnd || "";

            let daysText = "-";
            let daysValue = null;
            let danger = false;

            if(contractEnd){

                const endDate =
                    new Date(contractEnd + "T00:00:00");

                if(!isNaN(endDate.getTime())){

                    endDate.setHours(0,0,0,0);

                    const diff =
                        endDate.getTime() - today.getTime();

                    daysValue = Math.ceil(
                        diff /
                        (1000 * 60 * 60 * 24)
                    );

                    if(daysValue > 0){

                        daysText =
                            daysValue + " Hari lagi";

                        if(daysValue <= 14){
                            danger = true;
                        }

                    }else if(daysValue === 0){

                        daysText = "Hari ini";
                        danger = true;

                    }else{

                        daysText =
                            "Lewat " +
                            Math.abs(daysValue) +
                            " Hari";

                        danger = true;

                    }

                }

            }

            let formattedDate = contractEnd;

            if(contractEnd){

                const parts = contractEnd.split("-");

                if(parts.length === 3){

                    const date = new Date(
                        Number(parts[0]),
                        Number(parts[1])-1,
                        Number(parts[2])
                    );

                    if(!isNaN(date.getTime())){

                        formattedDate = date.toLocaleDateString(
                            "id-ID",
                            {
                                day:"2-digit",
                                month:"long",
                                year:"numeric"
                            }
                        );

                    }

                }

            }

            const textColor =
                danger ? "#d32f2f" : "#222";

            return `

            <tr style="color:${textColor};">

                <td style="
                    padding:12px 8px;
                    text-align:center;
                    border-bottom:1px solid #eee;
                    font-weight:${danger ? "700" : "400"};
                    white-space:nowrap;
                ">
                    ${index + 1}
                </td>

                <td style="
                    padding:12px 8px;
                    border-bottom:1px solid #eee;
                    font-weight:${danger ? "700" : "600"};
                    white-space:nowrap;
                ">
                    ${employee.name || "-"}
                </td>

                <td style="
                    padding:12px 8px;
                    border-bottom:1px solid #eee;
                    font-weight:${danger ? "700" : "400"};
                    white-space:nowrap;
                ">
                    ${formattedDate || "-"}
                </td>

                <td style="
                    padding:12px 8px;
                    border-bottom:1px solid #eee;
                    font-weight:700;
                    white-space:nowrap;
                ">
                    ${daysText}
                </td>

            </tr>

            `;

        }).join("");
}

function showCompanySetup(){

    const setup =
        document.getElementById("companySetup");

    const app =
        document.getElementById("app");

    const login =
        document.getElementById("login");

    const registerScreen =
        document.getElementById("registerScreen");

    if(login){
        login.classList.add("hidden");
    }

    if(registerScreen){
        registerScreen.classList.add("hidden");
    }

    if(app){
        app.classList.add("hidden");
    }

    if(setup){
        setup.classList.remove("hidden");
    }

    apply();

}

            .value
            .trim();

    if(!companyName){

        alert(
            L === "en"
                ? "Company Name is required."
                : L === "zh"
                    ? "公司名称为必填项。"
                    : "Nama perusahaan wajib diisi."
        );

        return;
    }


    try{

        const uid =
            climexAuth.currentUser.uid;


        const companyData = {

            companyName:
                companyName,

            companyAddress:
                document
                    .getElementById("setupCompanyAddress")
                    .value

        };


        await climexDB

            .collection("climex")
            .doc("profile")
            .set(
                companyData,
