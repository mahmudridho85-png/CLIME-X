<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CLIME-X Console</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f2ee;color:#292929;font-family:Arial,Helvetica,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;max-width:560px;margin:auto;background:#f5f2ee}
.top{height:64px;background:#fff;border-bottom:1px solid #e3ddd6;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:20}
.logo{font-size:22px;font-weight:900;letter-spacing:1px;color:#6f5842}
.lang{padding:8px 9px;border:1px solid #ddd5cd;border-radius:9px;background:#fff}
.page{padding:17px 16px 92px}
h1{font-size:24px;margin:3px 0 6px}
h2{font-size:18px;margin:0}
h3{font-size:15px;margin:0 0 7px}
.muted{color:#777;font-size:12px}
.card{background:#fff;border:1px solid #e4ddd5;border-radius:15px;padding:15px;margin-bottom:13px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#fff;border:1px solid #e4ddd5;border-radius:12px;padding:11px}
.stat b{display:block;font-size:20px;margin-top:5px}
.row{display:flex;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;gap:10px;align-items:center}
.btn{border:0;border-radius:10px;padding:11px 13px;font-weight:700}
.primary{background:#6f5842;color:#fff}
.outline{background:#fff;color:#6f5842;border:1px solid #6f5842}
.danger{background:#fff;color:#a44242;border:1px solid #d7a4a4}
.full{width:100%}
.badge{display:inline-block;padding:5px 8px;border-radius:99px;font-size:10px;font-weight:700}
.pending{background:#fff0c8;color:#7d5d00}
.approved{background:#e0f1e4;color:#347048}
.paid{background:#e0edf9;color:#39638a}
.rejected{background:#f7e0e0;color:#a13d3d}
.unread{background:#f2e5d8;color:#79583d}
.listitem{padding:13px 0;border-top:1px solid #eee}
.listitem:first-child{border-top:0}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);height:70px;background:#fff;border-top:1px solid #e3ddd6;display:grid;grid-template-columns:repeat(5,1fr);z-index:30}
.nav{border:0;background:#fff;color:#777;font-size:10px}
.nav span{display:block;font-size:19px;margin-bottom:3px}
.nav.active{color:#6f5842;font-weight:700}
.form{margin-bottom:12px}
.form label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}
.form input,.form textarea,.form select{width:100%;padding:11px;border:1px solid #ddd5cd;border-radius:10px;background:#fff}
.form textarea{min-height:100px;resize:vertical}
.tabs{display:flex;gap:6px;overflow:auto;margin:13px 0}
.tab{white-space:nowrap;border:1px solid #ddd5cd;background:#fff;border-radius:99px;padding:8px 12px;font-size:11px}
.tab.active{background:#6f5842;color:#fff;border-color:#6f5842}
.receipt-img{height:190px;background:#eee8e1;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#888;margin:10px 0}
.response{padding:10px;background:#f7f4f0;border-radius:10px;margin-top:8px;font-size:12px}
.modal{position:fixed;inset:0;background:#0007;z-index:50;display:flex;justify-content:center;align-items:stretch}
.modalbox{background:#fff;width:min(560px,100%);height:100vh;overflow:auto;padding:18px;scrollbar-width:none}
.modalbox::-webkit-scrollbar{display:none}
.login{min-height:100vh;display:flex;align-items:center;padding:20px}
.loginbox{width:100%;max-width:430px;margin:auto}
.loginlogo{text-align:center;font-size:34px;font-weight:900;color:#6f5842;letter-spacing:2px}
.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 14px;border-radius:9px;font-size:12px;z-index:80}
.hidden{display:none!important}
.switch{width:44px;height:24px;border-radius:20px;background:#bbb;border:0;position:relative}
.switch.on{background:#6f5842}
.switch:after{content:"";width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:.15s}
.switch.on:after{left:23px}
@media(min-width:700px){.app{box-shadow:0 0 35px #00000012}}
</style>
</head>
<body>

<div id="login" class="login">
<div class="loginbox">
<div style="display:flex;justify-content:flex-end">
<select id="loginLang" class="lang" onchange="setLang(this.value)">
<option value="id">🇮🇩 Indonesia</option><option value="en">🇬🇧 English</option><option value="zh">🇨🇳 中文</option>
</select></div>
<div class="loginlogo">CLIME-X</div>
<div class="muted" style="text-align:center;margin-top:5px" data-t="console">Console</div>
<div class="card" style="margin-top:24px">
<div class="form"><label data-t="companyId">ID Perusahaan</label><input id="company"></div>
<div class="form"><label data-t="adminUser">Admin Username</label><input id="admin"></div>
<div class="form"><label data-t="password">Password</label><input type="password" id="pass"></div>
<button class="btn primary full" onclick="loginAdmin()" data-t="login">MASUK</button>
</div>
</div>
</div>

<div id="app" class="app hidden">
<header class="top">
<div class="logo">CLIME-X</div>
<div class="row"><span id="bell" style="font-size:20px;cursor:pointer" onclick="page('notifications')">🔔</span>
<select id="appLang" class="lang" onchange="setLang(this.value)">
<option value="id">🇮🇩 ID</option><option value="en">🇬🇧 EN</option><option value="zh">🇨🇳 中文</option>
</select></div>
</header>
<main id="content" class="page"></main>
<nav class="bottom">
<button class="nav active" data-p="home" onclick="page('home')"><span>⌂</span><span data-t="home">Beranda</span></button>
<button class="nav" data-p="claims" onclick="page('claims')"><span>▣</span><span data-t="claims">Klaim</span></button>
<button class="nav" data-p="employees" onclick="page('employees')"><span>●</span><span data-t="employees">Karyawan</span></button>
<button class="nav" data-p="announce" onclick="page('announce')"><span>◉</span><span data-t="announcements">Pengumuman</span></button>
<button class="nav" data-p="more" onclick="page('more')"><span>☰</span><span data-t="more">Lainnya</span></button>
</nav>
</div>

<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div id="modalbox" class="modalbox"></div></div>

<script>
const D={
console:{id:"Console",en:"Console",zh:"控制台"},companyId:{id:"ID Perusahaan",en:"Company ID",zh:"公司 ID"},adminUser:{id:"Username Admin",en:"Admin Username",zh:"管理员用户名"},password:{id:"Password",en:"Password",zh:"密码"},login:{id:"MASUK",en:"LOGIN",zh:"登录"},
home:{id:"Beranda",en:"Home",zh:"首页"},claims:{id:"Klaim",en:"Claims",zh:"报销"},employees:{id:"Karyawan",en:"Employees",zh:"员工"},announcements:{id:"Pengumuman",en:"Announcements",zh:"公告"},more:{id:"Lainnya",en:"More",zh:"更多"},
welcome:{id:"Selamat datang",en:"Welcome",zh:"欢迎"},newClaims:{id:"KLAIM BARU",en:"NEW CLAIMS",zh:"新报销"},pending:{id:"Menunggu Review",en:"Pending Review",zh:"待审核"},approved:{id:"Disetujui",en:"Approved",zh:"已批准"},waitingPay:{id:"Menunggu Bayar",en:"Waiting Payment",zh:"待付款"},paidToday:{id:"Dibayar Hari Ini",en:"Paid Today",zh:"今日已付款"},todayTotal:{id:"Total Hari Ini",en:"Today's Total",zh:"今日总额"},viewAll:{id:"Lihat Semua",en:"View All",zh:"查看全部"},
all:{id:"Semua",en:"All",zh:"全部"},review:{id:"Periksa",en:"Review",zh:"审核"},approve:{id:"SETUJUI",en:"APPROVE",zh:"批准"},reject:{id:"TOLAK",en:"REJECT",zh:"拒绝"},markPaid:{id:"TANDAI SUDAH DIBAYAR",en:"MARK AS PAID",zh:"标记为已付款"},reason:{id:"Alasan",en:"Reason",zh:"原因"},reasonPlaceholder:{id:"Masukkan alasan penolakan...",en:"Enter rejection reason...",zh:"请输入拒绝原因..."},
claimDetail:{id:"Detail Klaim",en:"Claim Detail",zh:"报销详情"},employee:{id:"Karyawan",en:"Employee",zh:"员工"},receipts:{id:"Receipt",en:"Receipts",zh:"收据"},amount:{id:"Nominal",en:"Amount",zh:"金额"},date:{id:"Tanggal",en:"Date",zh:"日期"},category:{id:"Kategori",en:"Category",zh:"类别"},payment:{id:"Pembayaran",en:"Payment",zh:"付款"},paid:{id:"Dibayar",en:"Paid",zh:"已支付"},notifications:{id:"Notifikasi",en:"Notifications",zh:"通知"},newClaimNotice:{id:"Klaim baru masuk",en:"New claim received",zh:"收到新的报销"},
announcementTitle:{id:"Pengumuman Perusahaan",en:"Company Announcements",zh:"公司公告"},createAnnouncement:{id:"BUAT PENGUMUMAN",en:"CREATE ANNOUNCEMENT",zh:"创建公告"},general:{id:"SEMUA KARYAWAN",en:"ALL EMPLOYEES",zh:"全体员工"},group:{id:"GROUP",en:"GROUP",zh:"群组"},personal:{id:"PERSONAL",en:"PERSONAL",zh:"个人"},title:{id:"Judul",en:"Title",zh:"标题"},message:{id:"Isi Pengumuman",en:"Announcement",zh:"公告内容"},send:{id:"KIRIM",en:"SEND",zh:"发送"},response:{id:"Respons Karyawan",en:"Employee Responses",zh:"员工回应"},understood:{id:"FAHAM",en:"UNDERSTOOD",zh:"已了解"},ask:{id:"TANYA ADMIN",en:"ASK ADMIN",zh:"咨询管理员"},neutral:{id:"NETRAL",en:"NEUTRAL",zh:"中立"},read:{id:"Dibaca",en:"Read",zh:"已读"},question:{id:"Pertanyaan",en:"Question",zh:"问题"},adminReply:{id:"Jawaban Admin",en:"Admin Reply",zh:"管理员回复"},
events:{id:"Event",en:"Events",zh:"活动"},createEvent:{id:"BUAT EVENT",en:"CREATE EVENT",zh:"创建活动"},location:{id:"Lokasi",en:"Location",zh:"地点"},time:{id:"Waktu",en:"Time",zh:"时间"},employeesCount:{id:"Jumlah Karyawan",en:"Employees",zh:"员工数量"},
subscription:{id:"Langganan",en:"Subscription",zh:"订阅"},active:{id:"AKTIF",en:"ACTIVE",zh:"有效"},expires:{id:"Berlaku sampai",en:"Expires",zh:"到期"},plan:{id:"Paket",en:"Plan",zh:"套餐"},monthly:{id:"Bulanan",en:"Monthly",zh:"月度"},yearly:{id:"Tahunan",en:"Yearly",zh:"年度"},subscribe:{id:"BERLANGGANAN",en:"SUBSCRIBE",zh:"订阅"},settings:{id:"Pengaturan",en:"Settings",zh:"设置"},logout:{id:"Keluar",en:"Logout",zh:"退出"},employeeManagement:{id:"Manajemen Karyawan",en:"Employee Management",zh:"员工管理"},addEmployee:{id:"TAMBAH KARYAWAN",en:"ADD EMPLOYEE",zh:"添加员工"},department:{id:"Departemen",en:"Department",zh:"部门"},status:{id:"Status",en:"Status",zh:"状态"}
};

let L=localStorage.getItem("climex_console_lang")||"id",current="home";
let claims=[
{id:"CLX-00125",name:"John Smith",dept:"Operations",count:5,total:350.75,currency:"USD",status:"pending",date:"24 Sep 2026",category:"Business Travel"},
{id:"CLX-00124",name:"Rocky Tan",dept:"Sales",count:2,total:128.00,currency:"USD",status:"approved",date:"24 Sep 2026",category:"Transportation"},
{id:"CLX-00123",name:"Aldo Chen",dept:"Finance",count:4,total:580.00,currency:"USD",status:"paid",date:"24 Sep 2026",category:"Hotel"}
];
let employees=[
{id:"EMP-00125",name:"John Smith",dept:"Operations",email:"john@company.com",status:"Active"},
{id:"EMP-00126",name:"Rocky Tan",dept:"Sales",email:"rocky@company.com",status:"Active"},
{id:"EMP-00127",name:"Aldo Chen",dept:"Finance",email:"aldo@company.com",status:"Active"},
{id:"EMP-00128",name:"Maria Lee",dept:"HR",email:"maria@company.com",status:"Active"}
];
let announcements=[
{id:1,title:"New Business Travel Policy",text:"Starting October 1, all employees travelling for business must follow the new travel procedure.",audience:"ALL",responses:[
{name:"John Smith",r:"understood",read:"24 Sep 2026, 14:32"},
{name:"Rocky Tan",r:"ask",q:"Is there any additional contribution?",reply:"No additional contribution.",read:"24 Sep 2026, 14:40"},
{name:"Aldo Chen",r:"neutral",read:"24 Sep 2026, 15:07"}]},
{id:2,title:"Company Information",text:"Please take note of the latest information from management.",audience:"ALL",responses:[
{name:"John Smith",r:"understood",read:"23 Sep 2026, 10:15"}]}
];
let events=[{title:"Annual Company Dinner 2026",date:"20 Dec 2026",time:"19:00",location:"Grand Ballroom",audience:"ALL"}];
let notifications=[
{title:"New claim received",text:"John Smith submitted CLX-00125",time:"2 min ago",unread:true},
{title:"New employee question",text:"Rocky Tan asked about an announcement",time:"18 min ago",unread:true},
{title:"Payment completed",text:"CLX-00123 has been marked as paid",time:"1 hour ago",unread:false}
];

function t(k){return D[k]?.[L]||k}
function setLang(v){L=v;localStorage.setItem("climex_console_lang",v);loginLang.value=v;appLang.value=v;apply();if(!app.classList.contains("hidden"))page(current)}
function apply(){document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t))}
function loginAdmin(){login.classList.add("hidden");app.classList.remove("hidden");page("home")}
function page(p){current=p;document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x.dataset.p===p));if(p==="home")home();if(p==="claims")claimsPage();if(p==="employees")employeesPage();if(p==="announce")announcePage();if(p==="notifications")notificationsPage();if(p==="more")morePage();apply()}
function statusBadge(s){let m={pending:["pending",t("pending")],approved:["approved",t("approved")],paid:["paid",t("paid")],rejected:["rejected",t("reject")]};return `<span class="badge ${m[s][0]}">${m[s][1]}</span>`}
function claimRows(){return claims.map(x=>`<div class="listitem"><div class="between"><div><b>${x.id}</b><div class="muted">${x.name} · ${x.dept}</div><div class="muted">${x.count} ${t("receipts")} · ${x.date}</div></div><div style="text-align:right"><b>${x.currency} ${x.total.toFixed(2)}</b><br>${statusBadge(x.status)}<br><button class="btn outline" style="margin-top:7px;padding:7px 9px;font-size:10px" onclick="openClaim('${x.id}')">${t("review")}</button></div></div></div>`).join("")}
function home(){content.innerHTML=`<div class="muted">${t("welcome")}</div><h1>CLIME-X Console</h1><div class="muted">ABC001 · Main Company</div><div class="grid3" style="margin-top:15px"><div class="stat"><span class="muted">${t("pending")}</span><b>1</b></div><div class="stat"><span class="muted">${t("waitingPay")}</span><b>1</b></div><div class="stat"><span class="muted">${t("paidToday")}</span><b>24</b></div></div><div class="card" style="margin-top:13px"><div class="between"><h2>${t("newClaims")}</h2><span class="badge unread">1</span></div>${claimRows().split("</div>").slice(0,1).join("</div>")}<button class="btn primary full" style="margin-top:10px" onclick="page('claims')">${t("viewAll")}</button></div><div class="card"><div class="between"><h2>${t("todayTotal")}</h2><b style="font-size:22px">USD 4,580.25</b></div></div><div class="card"><div class="between"><h2>${t("notifications")}</h2><span>🔔</span></div><div class="listitem"><b>${notifications[0].title}</b><div class="muted">${notifications[0].text}</div></div></div>`}
function claimsPage(){content.innerHTML=`<div class="between"><div><div class="muted">${t("claims")}</div><h1>${t("newClaims")}</h1></div></div><div class="tabs"><button class="tab active">${t("all")}</button><button class="tab">${t("pending")}</button><button class="tab">${t("approved")}</button><button class="tab">${t("paid")}</button></div><div class="card">${claimRows()}</div>`}
function openClaim(id){let x=claims.find(a=>a.id===id);modalbox.innerHTML=`<div class="between"><h2>${t("claimDetail")}</h2><button class="btn outline" onclick="closeModal()">×</button></div><div class="card" style="margin-top:13px"><div class="between"><div><b>${x.id}</b><div class="muted">${x.name} · ${x.dept}</div></div>${statusBadge(x.status)}</div><div style="font-size:27px;font-weight:800;margin-top:10px">${x.currency} ${x.total.toFixed(2)}</div><div class="muted">${x.count} ${t("receipts")} · ${x.date}</div></div><div class="card"><h3>${t("receipts")}</h3>${Array.from({length:x.count},(_,i)=>`<div class="listitem"><b>Receipt #${i+1}</b><div class="receipt-img">Receipt Photo</div><div class="muted">${x.category} · ${x.currency} ${(x.total/x.count).toFixed(2)}</div></div>`).join("")}</div><div class="row">${x.status==="pending"?`<button class="btn danger" style="flex:1" onclick="rejectClaim('${x.id}')">${t("reject")}</button><button class="btn primary" style="flex:1" onclick="approveClaim('${x.id}')">${t("approve")}</button>`:""}${x.status==="approved"?`<button class="btn primary full" onclick="payClaim('${x.id}')">${t("markPaid")}</button>`:""}</div>`;modal.classList.remove("hidden")}
function approveClaim(id){let x=claims.find(a=>a.id===id);x.status="approved";closeModal();toast("✓ "+t("approve"));claimsPage()}
function rejectClaim(id){let r=prompt(t("reasonPlaceholder"));if(r===null)return;let x=claims.find(a=>a.id===id);x.status="rejected";x.reason=r;closeModal();toast("✓ "+t("reject"));claimsPage()}
function payClaim(id){let x=claims.find(a=>a.id===id);x.status="paid";closeModal();toast("✓ "+t("markPaid"));claimsPage()}
function employeesPage(){content.innerHTML=`<div class="between"><div><div class="muted">${t("employees")}</div><h1>${t("employeeManagement")}</h1></div><button class="btn primary" onclick="addEmployee()">${t("addEmployee")}</button></div><div class="card" style="margin-top:13px">${employees.map(e=>`<div class="listitem"><div class="between"><div><b>${e.name}</b><div class="muted">${e.id} · ${e.dept}</div><div class="muted">${e.email}</div></div><span class="badge approved">${e.status}</span></div></div>`).join("")}</div>`}
function addEmployee(){modalbox.innerHTML=`<h2>${t("addEmployee")}</h2><div style="margin-top:14px"><div class="form"><label>${t("employee")}</label><input placeholder="John Smith"></div><div class="form"><label>${t("department")}</label><input placeholder="Operations"></div><div class="form"><label>Email</label><input placeholder="employee@company.com"></div><button class="btn primary full" onclick="closeModal();toast('✓')">${t("addEmployee")}</button></div>`;modal.classList.remove("hidden")}
function announcePage(){content.innerHTML=`<div class="between"><div><div class="muted">${t("announcements")}</div><h1>${t("announcementTitle")}</h1></div><button class="btn primary" onclick="createAnnouncement()">${t("createAnnouncement")}</button></div>${announcements.map(a=>`<div class="card"><div class="between"><div><h3>${a.title}</h3><div class="muted">${a.audience} · 24 Sep 2026</div></div><span class="badge approved">${a.responses.length} responses</span></div><p class="muted" style="line-height:1.5">${a.text}</p><button class="btn outline full" onclick="openAnnouncement(${a.id})">${t("response")}</button></div>`).join("")}<div class="card"><div class="between"><h2>${t("events")}</h2><button class="btn outline" onclick="createEvent()">${t("createEvent")}</button></div>${events.map(e=>`<div class="listitem"><b>${e.title}</b><div class="muted">${e.date} · ${e.time} · ${e.location}</div></div>`).join("")}</div>`}
function openAnnouncement(id){let a=announcements.find(x=>x.id===id);modalbox.innerHTML=`<div class="between"><h2>${a.title}</h2><button class="btn outline" onclick="closeModal()">×</button></div><p class="muted" style="line-height:1.5">${a.text}</p><div class="card"><h3>${t("response")}</h3>${a.responses.map(r=>`<div class="response"><div class="between"><b>${r.name}</b><span class="badge ${r.r==="understood"?"approved":r.r==="ask"?"pending":"neutral"}">${r.r==="understood"?t("understood"):r.r==="ask"?t("ask"):t("neutral")}</span></div><div class="muted" style="margin-top:6px">${t("read")}: ${r.read}</div>${r.q?`<div style="margin-top:8px"><b>${t("question")}:</b> ${r.q}</div><div style="margin-top:6px"><b>${t("adminReply")}:</b> ${r.reply||"—"}</div>`:""}</div>`).join("")}</div>`;modal.classList.remove("hidden")}
function createAnnouncement(){modalbox.innerHTML=`<h2>${t("createAnnouncement")}</h2><div style="margin-top:14px"><div class="form"><label>${t("title")}</label><input></div><div class="form"><label>${t("message")}</label><textarea></textarea></div><div class="form"><label>Audience</label><select><option>${t("general")}</option><option>${t("group")}</option><option>${t("personal")}</option></select></div><button class="btn primary full" onclick="closeModal();toast('✓ '+t('send'))">${t("send")}</button></div>`;modal.classList.remove("hidden")}
function createEvent(){modalbox.innerHTML=`<h2>${t("createEvent")}</h2><div style="margin-top:14px"><div class="form"><label>${t("title")}</label><input></div><div class="form"><label>${t("date")}</label><input type="date"></div><div class="form"><label>${t("time")}</label><input type="time"></div><div class="form"><label>${t("location")}</label><input></div><button class="btn primary full" onclick="closeModal();toast('✓')">${t("createEvent")}</button></div>`;modal.classList.remove("hidden")}
function notificationsPage(){content.innerHTML=`<div><div class="muted">${t("notifications")}</div><h1>${t("notifications")}</h1></div><div class="card">${notifications.map(n=>`<div class="listitem"><div class="between"><b>${n.title}</b>${n.unread?'<span class="badge unread">NEW</span>':''}</div><div class="muted">${n.text}</div><div class="muted" style="margin-top:5px">${n.time}</div></div>`).join("")}</div>`}
function morePage(){content.innerHTML=`<h1>${t("more")}</h1><div class="card"><button class="btn outline full" onclick="page('notifications')">🔔 ${t("notifications")}</button><button class="btn outline full" style="margin-top:9px" onclick="subscriptionPage()">💳 ${t("subscription")}</button><button class="btn outline full" style="margin-top:9px" onclick="settingsPage()">⚙️ ${t("settings")}</button><button class="btn outline full" style="margin-top:9px" onclick="location.reload()">${t("logout")}</button></div>`}
function subscriptionPage(){content.innerHTML=`<div><div class="muted">${t("subscription")}</div><h1>CLIME-X PRO</h1></div><div class="card"><div class="between"><div><b>${t("plan")}: ${t("yearly")}</b><div class="muted">${t("expires")}: 24 Sep 2027</div></div><span class="badge approved">${t("active")}</span></div></div><div class="card"><h3>${t("monthly")}</h3><h2>Rp 49.000</h2><button class="btn outline full" style="margin-top:10px">${t("subscribe")}</button></div><div class="card"><h3>${t("yearly")}</h3><h2>Rp 520.000</h2><button class="btn primary full" style="margin-top:10px">${t("subscribe")}</button></div>`}
