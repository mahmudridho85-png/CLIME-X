<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Privacy Policy | Clime-X</title>
<style>
:root{--brown:#b68b62;--dark:#5b3d29;--cream:#f7f2eb;--text:#34291f;--muted:#74695f;--line:#e8ded3}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.7}
header{background:#379d6a;color:#fff;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.brand{font-size:22px;font-weight:800}.lang{border:1px solid rgba(255,255,255,.4);border-radius:9px;background:transparent;color:#fff;padding:9px 12px;font-weight:700}
main{max-width:900px;margin:35px auto;padding:0 20px 50px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:32px;box-shadow:0 8px 24px rgba(75,52,34,.08)}
h1{margin:0 0 7px;color:var(--dark);font-size:29px}h2{margin:28px 0 8px;color:var(--dark);font-size:18px}p,li{font-size:14px}.updated{color:var(--muted);font-size:12px;margin-bottom:25px}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
@media(max-width:600px){main{margin:18px auto;padding:0 12px}.card{padding:22px}h1{font-size:24px}}
</style>
</head>
<body>
<header><div class="brand">Clime-X</div><select id="lang" class="lang" onchange="setLang(this.value)"><option value="id">🇮🇩 Indonesia</option><option value="en">🇬🇧 English</option><option value="zh">🇨🇳 中文</option></select></header>
<main><div class="card" id="content"></div><div class="footer">© Clime-X</div></main>
<script>
const T={
id:{
title:"Kebijakan Privasi",date:"Terakhir diperbarui: 4 Oktober 2026",
sections:[
["1. Pendahuluan","Clime-X menghargai privasi pengguna. Kebijakan Privasi ini menjelaskan bagaimana Clime-X mengumpulkan, menggunakan, menyimpan, dan melindungi informasi ketika Anda menggunakan Clime-X Employee, Clime-X Web Console, dan layanan terkait."],
["2. Informasi yang Kami Kelola","Informasi yang dapat diproses melalui Clime-X meliputi informasi akun seperti nama, alamat email, dan informasi autentikasi; informasi perusahaan seperti nama, alamat, kontak, logo, dan informasi perusahaan lain yang dimasukkan Administrator; data karyawan seperti nama, ID karyawan, departemen, jabatan, tanggal masuk, kontrak, dan informasi terkait yang dimasukkan perusahaan; serta data operasional seperti pengajuan cuti, klaim/pengeluaran, pengumuman, event, komentar, notifikasi, dan foto yang diunggah melalui fitur yang tersedia."],

["4. Penggunaan Informasi","Informasi digunakan untuk membuat dan mengelola akun, menghubungkan Administrator dengan data perusahaan, menyediakan fitur Employee dan Web Console, memproses pengajuan cuti dan klaim/pengeluaran, menampilkan pengumuman dan event, mengirim notifikasi yang diperlukan, menjaga keamanan layanan, serta melakukan perbaikan dan pemeliharaan layanan."],
["5. Foto dan Konten yang Diunggah","Jika Anda menggunakan fitur yang memungkinkan pengunggahan foto, foto tersebut diproses untuk tujuan fitur terkait, misalnya sebagai bukti pada klaim atau sebagai bagian dari konten perusahaan. Jangan mengunggah informasi yang tidak diperlukan atau informasi milik pihak lain tanpa hak yang sesuai."],
["6. Penyimpanan Data","Data Clime-X disimpan dan diproses menggunakan layanan Firebase, termasuk Firebase Authentication dan Cloud Firestore. Data dapat tetap tersimpan selama diperlukan untuk menyediakan layanan, memenuhi kewajiban perusahaan, menyelesaikan sengketa, menjaga keamanan, atau untuk tujuan bisnis yang sah."],
["7. Akses dan Pengelolaan Data","Administrator perusahaan bertanggung jawab atas data perusahaan dan data karyawan yang dimasukkan ke dalam Clime-X. Akses terhadap data dibatasi berdasarkan akun dan fungsi yang tersedia di dalam sistem. Pengguna harus menjaga keamanan akun dan tidak membagikan kredensial kepada pihak lain."],
["8. Keamanan","Clime-X menerapkan langkah-langkah yang wajar untuk membantu melindungi informasi dari akses, perubahan, pengungkapan, atau penghancuran yang tidak sah. Namun, tidak ada sistem elektronik yang dapat dijamin 100% aman."],
["9. Layanan Pihak Ketiga","Clime-X menggunakan layanan pihak ketiga yang diperlukan untuk menjalankan layanan, termasuk Firebase Authentication dan Cloud Firestore. Penggunaan layanan tersebut juga tunduk pada kebijakan penyedia layanan masing-masing."],
["10. Hak Pengguna","Pengguna dapat meminta informasi mengenai data yang terkait dengan akun atau perusahaan mereka dan dapat meminta koreksi atau penghapusan data sejauh dapat dilakukan dan tidak bertentangan dengan kebutuhan operasional, kewajiban hukum, atau kepentingan keamanan."],
["11. Penghapusan Akun dan Data","Permintaan penghapusan akun atau data dapat diajukan kepada pihak Clime-X. Penghapusan dapat memerlukan verifikasi kepemilikan akun. Sebagian data dapat tetap dipertahankan apabila diperlukan untuk keamanan, pencatatan, penyelesaian sengketa, atau kewajiban hukum."],
["12. Perubahan Kebijakan","Kebijakan Privasi ini dapat diperbarui dari waktu ke waktu. Versi terbaru akan dipublikasikan pada halaman ini dengan tanggal pembaruan yang sesuai."],
["13. Hubungi Kami","Jika Anda memiliki pertanyaan mengenai Kebijakan Privasi atau pengelolaan data di Clime-X, silakan hubungi pihak Clime-X melalui kontak resmi yang tersedia di situs Clime-X."]
]},
en:{
title:"Privacy Policy",date:"Last updated: October 4, 2026",
sections:[
["1. Introduction","Clime-X respects user privacy. This Privacy Policy explains how Clime-X collects, uses, stores, and protects information when you use Clime-X Employee, Clime-X Web Console, and related services."],
["2. Information We Process","Information processed through Clime-X may include account information such as name, email address, and authentication information; company information such as company name, address, contact details, logo, and other information entered by an Administrator; employee data such as name, employee ID, department, position, joining date, contract information, and related information entered by the company; and operational data such as leave requests, claims/expenses, announcements, events, comments, notifications, and photos uploaded through available features."],
["3. Login and Authentication","Clime-X supports registration and login using email and password as well as Google sign-in. Authentication information is processed through Firebase Authentication. Clime-X does not request or store your Google password."],
["4. How Information Is Used","Information is used to create and manage accounts, connect Administrators with company data, provide Employee and Web Console features, process leave requests and claims/expenses, display announcements and events, deliver necessary notifications, maintain service security, and improve and maintain the service."],
["5. Photos and Uploaded Content","When you use features that allow photo uploads, photos are processed for the relevant feature, such as supporting a claim or as part of company content. Do not upload unnecessary information or another person's information without appropriate rights."],
["6. Data Storage","Clime-X stores and processes data using Firebase services, including Firebase Authentication and Cloud Firestore. Data may remain stored as long as necessary to provide the service, meet company obligations, resolve disputes, maintain security, or for other legitimate business purposes."],
["7. Access and Data Management","Company Administrators are responsible for company and employee data entered into Clime-X. Access to data is limited according to accounts and functions available in the system. Users are responsible for keeping their accounts secure and must not share credentials with others."],
["8. Security","Clime-X uses reasonable measures to help protect information from unauthorized access, alteration, disclosure, or destruction. However, no electronic system can be guaranteed to be completely secure."],
["9. Third-Party Services","Clime-X uses third-party services required to operate the service, including Firebase Authentication and Cloud Firestore. Use of those services is also subject to the respective providers' policies."],
["10. User Rights","Users may request information regarding data associated with their account or company and may request correction or deletion where reasonably possible and where this does not conflict with operational needs, legal obligations, or security interests."],
["11. Account and Data Deletion","Requests to delete an account or data may be submitted to Clime-X. Verification of account ownership may be required. Certain data may be retained when necessary for security, records, dispute resolution, or legal obligations."],
["12. Changes to This Policy","This Privacy Policy may be updated from time to time. The latest version will be published on this page together with the applicable update date."],
["13. Contact Us","If you have questions about this Privacy Policy or data handling in Clime-X, please contact Clime-X through the official contact information available on the Clime-X website."]
]},

["8. 安全","Clime-X 采取合理措施帮助保护信息，防止未经授权的访问、修改、披露或破坏。但是，任何电子系统都无法保证绝对安全。"],

["10. 用户权利","用户可以请求了解与其账户或企业相关的数据，并可在合理可行且不影响运营需求、法律义务或安全利益的情况下请求更正或删除数据。"],
["11. 账户和数据删除","您可以向 Clime-X 提交账户或数据删除请求。删除请求可能需要验证账户所有权。出于安全、记录保存、争议解决或法律义务的需要，部分数据可能需要继续保留。"],

["13. 联系我们","如果您对本隐私政策或 Clime-X 的数据处理有任何疑问，请通过 Clime-X 官方网站提供的联系方式与我们联系。"]

function setLang(l){localStorage.setItem("climexLegalLanguage",l);render(l)}
function render(l){const t=T[l]||T.id;document.getElementById("lang").value=l;document.getElementById("content").innerHTML=`<h1>${t.title}</h1><div class="updated">${t.date}</div>${t.sections.map(s=>`<section><h2>${s[0]}</h2><p>${s[1]}</p></section>`).join("")}`}
render(localStorage.getItem("climexLegalLanguage")||"id");
</script>

</html>
