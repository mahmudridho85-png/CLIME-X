["CLIME-X PLATFORM ABUSE HANDLING POLICY",`Effective Date: October 6, 2026<br><br>
<strong>1. INTRODUCTION AND PURPOSE</strong><br>
Clime-X is a communication and work management platform for corporate environments. We are committed to maintaining a safe, professional, and legally compliant digital environment. This document governs prohibited conduct, reporting mechanisms, and the handling of platform abuse.<br><br>
Clime-X is a Private-Scope Electronic System Operator (PSE) using a User Generated Content (UGC) model as regulated under Indonesian Minister of Communication and Information Regulation No. 5 of 2020.<br><br>
<strong>2. DEFINITION OF ABUSE</strong><br>
Abuse means any use of Clime-X that violates the laws of the Republic of Indonesia, public decency, or the legitimate purposes of the platform.<br><br>
<strong>3. PROHIBITED USE</strong><br>
Users are strictly prohibited from using Clime-X to:<br>
a. Make threats of violence, intimidation, bullying, or take actions that endanger the safety of others;<br>
b. Spread hate speech, discrimination, or content containing SARA-related elements;<br>
c. Commit fraud, extortion, embezzlement, or defamation;<br>
d. Send, store, or distribute pornography, gambling, narcotics, terrorism-related content, or other content prohibited by applicable laws and regulations;<br>
e. Spread false information / hoaxes that harm other parties;<br>
f. Attempt to hack or damage systems, or remove / destroy electronic evidence related to alleged legal violations.<br><br>
<strong>4. REPORTING MECHANISM</strong><br>
Every User has the right and is encouraged to report suspected abuse:<br>
1. Use the [Report] button available on each message, file, or profile;<br>
2. Select the violation category;<br>
3. Provide a brief chronology (what, when, and where it occurred);<br>
4. The Clime-X system will automatically lock and archive the relevant evidence for review purposes.<br><br>
<strong>5. REVIEW AND ENFORCEMENT PROCEDURES</strong><br><br>
<strong>5.1 Internal Company Violations</strong><br>
For violations of work ethics, unprofessional communication, or disputes between employees:<br>
- The report will be forwarded entirely to the relevant Company Administrator;<br>
- The Company Administrator has full authority to review, mediate, and impose internal sanctions (warnings, access restrictions, removal from company groups);<br>
- Clime-X does not intervene in or retain records of such internal decisions.<br><br>
<strong>5.2 Suspected Crimes and Serious Violations</strong><br>
For suspected criminal acts, serious legal violations, or reports involving multiple users:<br>
- The report will be handled directly by the Clime-X Trust &amp; Safety Team;<br>
- Actions may include content removal, temporary suspension, permanent account blocking, and data preservation/locking;<br>
- Clime-X will cooperate with law enforcement authorities when there is a valid official request.<br><br>
<strong>5.3 Unsubstantiated Reports</strong><br>
- If a review finds that a report is unsubstantiated due to an error or misunderstanding, the reporter will not be sanctioned. The reported account will be restored promptly.<br>
- If a report is proven to have been intentionally and maliciously made to defame or harm another person, the reporter may receive sanctions ranging from a warning to account blocking and may be subject to further action under applicable law.<br><br>
<strong>5.4 Right to Appeal</strong><br>
Any user subject to access restrictions or account blocking has the right to appeal through Help Center &gt; Submit an Appeal within 7 (seven) calendar days from notification. Clime-X will provide an appeal decision within a maximum of 14 (fourteen) business days.<br><br>
<strong>6. EVIDENCE MANAGEMENT AND RETENTION</strong><br>
a. When content is reported, the system will apply Evidence Retention (Legal Hold). Such content may not be deleted, altered, or hidden by anyone, including its creator, until the review is completed.<br>
b. Users may delete their own content as long as it has not entered a reported or review status.<br>
c. Attempts to delete or destroy evidence after a report has been submitted may be considered a separate violation and may be reported to the relevant authorities.<br>
d. Report-related data is retained in accordance with the principle of limited retention under Indonesia's Personal Data Protection Law No. 27 of 2022. For suspected criminal acts, data is retained as long as necessary for legal proceedings and in accordance with applicable statutory retention obligations, for a maximum of 5 (five) years, unless a law enforcement authority or court issues a valid data preservation order.<br><br>
<strong>7. LIMITATION OF RESPONSIBILITY AND LEGAL COOPERATION</strong><br>
a. Clime-X only provides the platform. The content, accuracy, and legal consequences of each piece of content are entirely the responsibility of the User who created it.<br>
b. Clime-X is not responsible for losses arising from actions of other users outside Clime-X's control.<br>
c. Clime-X will only provide personal data or electronic evidence to authorized parties based on a valid official request in accordance with Indonesian legal procedures (for example, an investigator's order or a court order).<br><br>
By using Clime-X, you are deemed to have read, understood, and agreed to this Policy.<br><br>
<strong>Clime-X Team</strong>`],

["Clime-X 平台滥用处理政策",`生效日期：2026年10月6日<br><br>
<strong>1. 引言与目的</strong><br>
Clime-X 是面向企业环境的通信和工作管理平台。我们致力于维护安全、专业并符合法律要求的数字环境。本政策规定平台滥用的禁止行为、举报机制以及处理方式。<br><br>
Clime-X 是依据印度尼西亚通信与信息部 2020 年第 5 号条例所规定的、采用用户生成内容（UGC）模式的私人范围电子系统运营商（PSE）。<br><br>
<strong>2. 滥用的定义</strong><br>
滥用是指任何违反印度尼西亚共和国法律、社会道德规范或平台合法目的的 Clime-X 使用行为。<br><br>
<strong>3. 禁止使用</strong><br>
严禁用户利用 Clime-X 进行以下行为：<br>
a. 进行暴力威胁、恐吓、欺凌或危及他人人身安全的行为；<br>
b. 传播仇恨言论、歧视性内容或涉及种族、宗教、民族和群体（SARA）的内容；<br>
c. 实施欺诈、敲诈、挪用或诽谤行为；<br>
d. 发送、存储或传播色情、赌博、毒品、恐怖主义内容以及其他法律法规禁止的内容；<br>
e. 传播对他人造成损害的虚假信息 / 谣言；<br>
f. 试图入侵或破坏系统，或删除 / 销毁与涉嫌违法行为有关的电子证据。<br><br>
<strong>4. 举报机制</strong><br>
每位用户均有权并鼓励在发现疑似滥用行为时进行举报：<br>
1. 使用每条消息、文件或个人资料中提供的[举报]按钮；<br>
2. 选择违规类别；<br>
3. 填写简要经过（发生了什么、何时以及在哪里发生）；<br>
4. Clime-X 系统将自动锁定并归档相关证据，以供审查使用。<br><br>
<strong>5. 审查与处理程序</strong><br><br>
<strong>5.1 企业内部违规</strong><br>
对于违反工作道德、不专业的沟通或员工之间的争议：<br>
- 举报将完整转交相关企业管理员；<br>
- 企业管理员拥有审查、调解并实施内部处分的全部权限（警告、限制访问、移出企业群组）；<br>
- Clime-X 不介入，也不保存此类内部决定记录。<br><br>
<strong>5.2 疑似犯罪及严重违规</strong><br>
对于涉嫌犯罪、严重违法行为或涉及多名用户的举报：<br>
- 举报将由 Clime-X 信任与安全团队（Trust &amp; Safety）直接处理；<br>
- 可采取的措施包括删除内容、暂时冻结、永久封禁账户以及锁定数据；<br>
