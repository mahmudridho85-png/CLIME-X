<li>Clime-X 不介入，也不保存此类内部决定。</li>
</ul>

<h3>5.2 疑似违法行为</h3>
<p>对于涉嫌犯罪或严重违规行为：</p>
<ul class="policy-list">
<li>由 Clime-X 信任与安全团队直接处理；</li>
<li>措施可以包括删除内容、限制访问、暂停或封禁账户；</li>
<li>Clime-X 根据适用法律程序与有关部门合作。</li>
</ul>

<h3>5.3 无依据的举报</h3>
<ul class="policy-list">
<li>如果举报无法证实，举报人不会受到处罚，被举报账户将恢复；</li>

<h2>6. 证据管理与保存</h2>
<ol class="policy-list" type="a">

</ol>

<h2>8. 范围</h2>

<h2>10. 登录与访问安全</h2>

</ul>

<h2>11. 信息使用目的</h2>

<ul class="policy-list">

<li>运行应用功能并处理提交的申请；</li>
<li>发送与服务相关的通知；</li>

<h2>13. 数据存储</h2>
<p>数据通过安全的存储系统保存。数据将在运行服务、履行法律义务、解决争议以及维护系统安全所需期间继续保存。</p>
