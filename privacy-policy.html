<p>Clime-X is a communication and work management platform accessible globally. We are committed to maintaining a safe, professional, and legally compliant digital environment. This document governs the terms of use, reporting mechanisms, handling of abuse, and data and privacy management for all users.</p>

<li>Spreading false information or untrue news that may harm another party;</li>
<li>Accessing systems without authorization, damaging systems, or removing or destroying electronic evidence related to suspected legal violations.</li>
</ol>

<ol class="policy-list">
<li>The [Report] button available on each piece of content or profile;</li>

<li>Providing a brief description of the incident;</li>

<p>本政策规定 Clime-X 如何在所有 Clime-X 服务中收集、使用、存储和保护用户信息。不同国家的用户也享有其所在国家适用法律所规定的数据保护权利。</p>

<h2>9. 我们管理的信息类型</h2>
<ul class="policy-list">
<li><strong>账户信息</strong> — 姓名、电子邮箱和身份验证数据；</li>
<li><strong>企业信息</strong> — 企业名称、地址、联系方式、标志以及企业管理员输入的其他数据；</li>
<li><strong>成员数据</strong> — 姓名、身份、角色以及工作所需的相关信息；</li>
<li><strong>运营数据</strong> — 申请、报告、公告、活动、评论、通知和上传的文件。</li>
</ul>

<h2>10. 登录与访问安全</h2>
<ul class="policy-list">
<li>用户可以使用电子邮箱和密码注册及登录，也可以使用受支持的第三方服务账户；</li>
<li>登录过程通过安全的访问管理系统进行。Clime-X 不保存用户第三方账户的密码；</li>
<li>每位用户都必须保护账户信息的机密性，不得向他人分享登录凭据。</li>
</ul>

<h2>11. 信息使用目的</h2>
<p>数据用于：</p>
<ul class="policy-list">
<li>管理账户并将用户与工作环境连接；</li>
<li>运行应用功能并处理提交的申请；</li>
<li>发送与服务相关的通知；</li>
<li>维护安全以及进行系统维护和改进。</li>
</ul>

<h2>12. 上传的内容和文件</h2>
<p>通过应用提交的文件将根据所使用功能的目的进行处理。用户必须确保所提交的内容不侵犯他人的权利或违反适用规定。</p>

<h2>13. 数据存储</h2>
<p>数据通过安全的存储系统保存。数据将在运行服务、履行法律义务、解决争议以及维护系统安全所需期间继续保存。</p>

<h2>14. 访问限制</h2>
<ul class="policy-list">
<li>企业管理员负责通过企业账户输入的数据；</li>
<li>访问权限根据每位用户的角色和需求进行限制；</li>
<li>未经许可，用户个人数据不会与其他方共享，法律要求的情况除外。</li>
</ul>

<h2>15. 数据保护</h2>
<p>系统采取合理的安全措施，保护信息免受未经授权的访问、修改或披露。任何电子系统都无法完全没有风险，但 Clime-X 会持续提升服务安全性。</p>

<h2>16. 第三方服务</h2>
<p>Clime-X 可以使用运行平台所需的支持服务。这些服务对数据的使用也受相应服务提供商条款的约束。</p>

<h2>17. 用户权利</h2>
<p>用户可以请求了解、更正或删除自己的数据，但前提是此类请求不与运营需求、法律义务或安全利益相冲突。</p>

<h2>18. 账户删除</h2>
<p>用户可以向 Clime-X 提交账户删除请求。如为记录保存、问题解决或履行法律义务所需，部分数据可能继续保留。</p>

<h2>19. 政策更新</h2>
<p>本政策可能不时更新。最新版本及注明的更新日期将在本页面公布。</p>

<h2>20. 联系我们</h2>
<p>如对本政策有任何疑问，请通过 Clime-X 网站提供的官方联系方式与 Clime-X 联系。</p>

<p><strong>使用 Clime-X 即表示您已阅读、理解并同意上述全部规定。</strong></p>
